[whisper]
backend = faster
# tiny / base / small / medium / large-v3
model = large-v3-turbo
; model = large-v3
; model = medium
; model = tiny
; model = base
; model = small
device = cuda

compute_type = int8_float32
; compute_type — как считать веса на железе. Определяется видеокартой, не моделью:
; Pascal (GTX 10xx) → int8_float32
; Turing/Ampere/Ada (RTX 20xx/30xx/40xx) → float16
; CPU → int8

language = ru

; beam_size — алгоритм поиска при расшифровке. 1 = жадный (быстро), 5 = бим-сёрч (точнее, в 2-3 раза медленнее). От модели не зависит.
; beam_size = 5
beam_size = 1

[audio]
sample_rate = 16000

[text]
add_trailing_space = true

[paste]
# method = unicode (мгновенная прямая печать без затирания буфера обмена) или clipboard
method = unicode
# char_delay = 0.0 для отправки всей строки единым пакетом (0 мс задержки)
char_delay = 0.0

[log]
enabled = true
file = transcriptions.log

[sound]
enabled = true
file = ready.mp3
volume = 0.7

[hotkey]
key = f9 
mode = toggle
; mode = hold
# Режимы:
# hold — текущий: держишь F9 → слушает, отпустил → остановка
# toggle — новый: нажал F9 → начал слушать, нажал F9 ещё раз → остановил
