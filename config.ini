[whisper]
backend = faster
# tiny / base / small / medium / large-v3
model = large-v3-turbo
; model = large-v3
; model = medium
; model = tiny
; model = base
; model = small
device = cuda

compute_type = int8_float32
; compute_type — как считать веса на железе. Определяется видеокартой, не моделью:
; Pascal (GTX 10xx) → int8_float32
; Turing/Ampere/Ada (RTX 20xx/30xx/40xx) → float16
; CPU → int8

language = ru

; beam_size — алгоритм поиска при расшифровке. 1 = жадный (быстро), 5 = бим-сёрч (точнее, в 2-3 раза медленнее). От модели не зависит.
; beam_size = 5
beam_size = 1

[hotkey]
; key = right_ctrl
key = f9

[audio]
sample_rate = 16000

[text]
add_trailing_space = true

[sound]
enabled = true
file = ready.mp3
volume = 0.7