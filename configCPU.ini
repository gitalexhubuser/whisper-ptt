[whisper]
# backend: faster  (pip install faster-whisper)  или openai (pip install openai-whisper)
backend = faster
# tiny / base / small / medium / large-v3
model = small
# cpu или cuda
device = cpu
# для faster-whisper: int8 / int8_float16 / float16 / float32
compute_type = int8
# ru / en / ...  (пусто = авто)
language = ru
beam_size = 1

[hotkey]
# Примеры: f9, ctrl+alt, ctrl+shift+space, right_alt, ...
key = f9

[audio]
sample_rate = 16000

[text]
add_trailing_space = true
